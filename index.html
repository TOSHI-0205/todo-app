<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4f7ef8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <title>ToDoアプリ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>ToDo リスト</h1>

    <div class="input-area">
      <input type="text" class="task-text" id="todoInput" placeholder="タスクを入力..." />
      <div class="due-wrap">
        <label for="dueInput">期限</label>
        <input type="date" id="dueInput" />
      </div>
      <button type="button" onclick="addTodo()">追加</button>
    </div>

    <div class="filters">
      <button class="active" onclick="setFilter('all', this)">すべて</button>
      <button onclick="setFilter('active', this)">未完了</button>
      <button onclick="setFilter('done', this)">完了済み</button>
    </div>

    <p class="sort-hint">表示は自動で並び替えです。期限が近い順、期限なしは一番下です。</p>

    <ul class="todo-list" id="todoList" aria-label="タスク一覧"></ul>

    <div class="footer">
      <span id="countLabel"></span>
      <button onclick="clearDone()">完了済みを削除</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
